name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: Packages · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile examples/python/senku.py

  brand:
    name: Brand assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SVG files are valid XML
        run: |
          for f in $(find brand docs -name '*.svg'); do
            python3 -c "import sys, xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])" "$f" && echo "ok $f"
          done
